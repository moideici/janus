[package]
name = "janus-rs"
license = "MIT"
description = "Prototype de recherche de Janus : chiffrement de fichiers post-quantique, indistinguable de l'aléa, à deux visages"
version = "0.1.0-alpha"
edition = "2024"
repository = "https://github.com/moideici/janus"
homepage = "https://docs.moideici.tech/janus/"
readme = "README.md"
keywords = ["chiffrement", "post-quantique", "deni-plausible", "x-wing", "ml-kem"]
categories = ["cryptography", "command-line-utilities"]
publish = false

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
curve25519-elligator2 = "0.1.0-alpha.2"
# Arithmétique modulo 2^255 − 19 prouvée (déjà dépendance du précédent) : inverse d'Elligator 2.
fiat-crypto = "0.2.9"
getrandom = "0.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
ml-kem = { version = "0.3", features = ["zeroize"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
rpassword = "7.5.5"
sha2 = "0.11.1"
sha3 = "0.12.0"
shake = "0.1"
subtle = "2.6.1"
zeroize = "1.9.2"

[lib]
name = "janus"
path = "src/lib.rs"

[[bin]]
name = "janus"
path = "src/main.rs"

[lints.rust]
# cfg(fuzzing) est posé par cargo-fuzz (voir fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 2
