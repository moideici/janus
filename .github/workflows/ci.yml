# Intégration continue : clippy (aucun avertissement toléré) et les tests,
# sous Linux, Windows et macOS, à chaque poussée sur main et à chaque PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: janus-rs
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable et clippy
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            janus-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('janus-rs/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release --locked

  clients:
    # Les quatre clients (spec/janus-v1.md) : leurs tests, puis l'interopérabilité
    # croisée entre eux et l'implémentation de référence.
    name: Clients et interopérabilité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            janus-rs/target
          key: ${{ runner.os }}-cargo-clients-${{ hashFiles('janus-rs/Cargo.lock') }}

      - name: Binaire de référence
        working-directory: janus-rs
        run: cargo build --release --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Client Python
        run: |
          python -m pip install "cryptography==48.0.1"
          python clients/python/test_janus.py

      - name: Client TypeScript
        run: node --test clients/typescript/test.ts

      - name: Client C#
        run: dotnet run -c Release --project clients/csharp/Janus -- selftest

      - name: Client Java
        run: sh clients/java/test.sh

      - name: Interopérabilité croisée
        run: python clients/interop.py
