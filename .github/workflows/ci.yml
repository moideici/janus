# Intégration continue : clippy (aucun avertissement toléré) et les tests,
# sous Linux, Windows et macOS, à chaque poussée sur main et à chaque PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: janus-rs
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable et clippy
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            janus-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('janus-rs/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release --locked
