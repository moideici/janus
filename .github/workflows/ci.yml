# Intégration continue : clippy (aucun avertissement toléré) et les tests,
# sous Linux, Windows et macOS, à chaque poussée sur main et à chaque PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: janus-rs
    steps:
      - uses: actions/checkout@v4

      - name: Rust (version épinglée par rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            janus-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('janus-rs/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Les cibles de fuzzing compilent
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly check --manifest-path fuzz/Cargo.toml --locked

      - name: Tests
        run: cargo test --release --locked

  clients:
    # Les quatre clients (spec/janus-v1.md) : leurs tests, puis l'interopérabilité
    # croisée entre eux et l'implémentation de référence.
    name: Clients et interopérabilité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (version épinglée)
        working-directory: janus-rs
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            janus-rs/target
          key: ${{ runner.os }}-cargo-clients-${{ hashFiles('janus-rs/Cargo.lock') }}

      - name: Binaire de référence
        working-directory: janus-rs
        run: cargo build --release --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Client Python
        run: |
          python -m pip install "cryptography==48.0.1"
          python clients/python/test_janus.py

      - name: Client TypeScript
        run: node --test clients/typescript/test.ts

      - name: Client C#
        run: dotnet run -c Release --project clients/csharp/Janus -- selftest

      - name: Client Java
        run: sh clients/java/test.sh

      - name: Interopérabilité croisée
        run: python clients/interop.py

  dependances:
    # Chaîne d'approvisionnement : failles connues (RustSec), licences, provenance.
    name: Dépendances (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: janus-rs/Cargo.toml

  reproductible:
    # Deux compilations, depuis deux dossiers différents, doivent donner un binaire
    # identique octet pour octet (docs/08-durcissement.md).
    name: Build reproductible (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: a
      - name: Rust (version épinglée)
        working-directory: a/janus-rs
        run: rustup toolchain install
      - name: Deux compilations
        run: |
          cp -r a /tmp/b
          for d in "$PWD/a" /tmp/b; do
            (cd "$d/janus-rs" && RUSTFLAGS="--remap-path-prefix=$d=/janus --remap-path-prefix=$HOME/.cargo=/cargo" \
              cargo build --release --locked --quiet)
          done
          sha256sum a/janus-rs/target/release/janus /tmp/b/janus-rs/target/release/janus
          cmp a/janus-rs/target/release/janus /tmp/b/janus-rs/target/release/janus
          echo "Binaire reproductible."
